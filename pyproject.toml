[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "devkit-cli"
version = "1.0.0"
description = "A fast, zero-dependency Python CLI toolkit for everyday developer tasks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["cli", "developer-tools", "hash", "encoding", "uuid", "json"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
devkit = "devkit:main"

[project.urls]
Homepage = "https://github.com/REPO/devkit-cli"
